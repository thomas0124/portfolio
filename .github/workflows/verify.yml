name: verify
on:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          ./scripts/secret-scan.sh --range "$base..HEAD"
      - name: Check template structure
        run: ./scripts/check-template.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run verification
        run: ./scripts/run-verify.sh
      - name: Check skill mirror sync
        run: ./scripts/check-skill-sync.sh
